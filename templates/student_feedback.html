<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student_feedback.css') }}">
</head>
<body>
<div class="app-wrapper">
    {% include 'partials/student_sidebar.html' %}
    <div class="main-content">
        {% include 'partials/navbar.html' %}
        <div class="page-content">
            {% include 'partials/flash.html' %}
            <h1 class="h5 mb-3">Feedback</h1>
            <div class="panel">
                <form method="POST">
                    <div class="mb-2"><label class="form-label small">Name</label><input type="text" class="form-control form-control-sm" value="{{ current_user_name }}" readonly></div>
                    <div class="mb-2"><label class="form-label small">Role</label><input type="text" class="form-control form-control-sm" value="Student" readonly></div>
                    <div class="mb-2"><label class="form-label small">Subject</label><input type="text" name="subject" class="form-control form-control-sm" required></div>
                    <div class="mb-2"><label class="form-label small">Feedback Message</label><textarea name="message" class="form-control form-control-sm" rows="4" required></textarea></div>
                    <button type="submit" class="btn btn-primary btn-sm">Submit Feedback</button>
                </form>
            </div>
        </div>
        {% include 'partials/footer.html' %}
    </div>
</div>
{% include 'partials/logout_modal.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
