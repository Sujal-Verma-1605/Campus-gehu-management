<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_resources.css') }}">
</head>
<body>
<div class="app-wrapper">
    {% include 'partials/admin_sidebar.html' %}
    <div class="main-content">
        {% include 'partials/navbar.html' %}
        <div class="page-content">
            {% include 'partials/flash.html' %}
            <h1 class="h5 mb-3">Resource Management</h1>
            <div class="panel">
                <table class="table table-sm table-bordered">
                    <thead class="table-light"><tr><th>Name</th><th>Type</th><th>Capacity</th></tr></thead>
                    <tbody>
                        {% for r in resources %}
                        <tr>
                            <td>{{ r.name }}</td><td>{{ r.type }}</td>
                            <td>
                                <form method="POST" class="d-flex gap-1 align-items-center">
                                    <input type="hidden" name="resource_id" value="{{ r.id }}">
                                    <input type="number" name="capacity" class="form-control form-control-sm" value="{{ r.capacity }}" min="1" style="width:90px">
                                    <button type="submit" class="btn btn-sm btn-secondary">Save</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        {% include 'partials/footer.html' %}
    </div>
</div>
{% include 'partials/logout_modal.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
