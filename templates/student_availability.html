<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student_availability.css') }}">
</head>
<body>
<div class="app-wrapper">
    {% include 'partials/student_sidebar.html' %}
    <div class="main-content">
        {% include 'partials/navbar.html' %}
        <div class="page-content">
            {% include 'partials/flash.html' %}
            <h1 class="h5 mb-3">Resource Availability</h1>
            <form method="GET" class="row g-2 mb-3 panel">
                <div class="col-md-4">
                    <label class="form-label small">Resource</label>
                    <select name="resource" class="form-select form-select-sm">
                        <option value="">All resources</option>
                        {% for r in resources %}
                        <option value="{{ r }}" {% if resource_filter == r %}selected{% endif %}>{{ r }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Date</label>
                    <input type="date" name="date" class="form-control form-control-sm" value="{{ date_filter }}">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary btn-sm w-100">Filter</button>
                </div>
            </form>
            <div class="panel">
                {% include 'partials/dynamic_availability_table.html' %}
            </div>
        </div>
        {% include 'partials/footer.html' %}
    </div>
</div>
{% include 'partials/logout_modal.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
